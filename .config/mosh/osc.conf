# mosh のカスタム版（~/src/mosh のフォーク）が手元で読み、mosh-server へ渡す OSC ポリシー。
# 書式は mosh(1) の OSC POLICY。どの規則にも合わない OSC は捨てられる。本家の mosh は読まない。

# IME の切り替え（bin/wezterm-uservar IME 0|1 → wezterm_windows.lua の user-var-changed）。
# latest ではなく always にするのは、同じ値が続いても毎回届ける必要があるため。Windows 側で
# IME を手で切り替えたあとに Neovim が同じ値をもう一度送っても、latest では落とされて戻らない。
1337 SetUserVar=IME= always
