set -g prefix C-Space
unbind C-b
unbind C-q

set -g mouse on
set -g history-limit 1000
set -g set-titles on
set -g set-titles-string '#S:#I:#W - #{pane_title}'

# Neovim responsiveness (nvim :checkhealth recommendations)
# - escape-time: 既定 500ms だと <Esc> 連携が遅延。10ms に下げる
# - focus-events: nvim の 'autoread' / FocusGained 連携を有効化
set -sg escape-time 10
set -g focus-events on

# Pane resize (prefix + HJKL, repeatable)
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Split panes (keep current path, match vim s/v)
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Quick window cycling (hold Ctrl, tap Space+n/p repeatedly)
bind C-n next-window
bind C-p previous-window

# Session switching (テーマごとにセッションを分けて横断する)
# tmux 既定の prefix+s (choose-tree) / prefix+L (last-session) は、上の
# split-window / resize-pane に割り当て済みで潰れているため別キーへ逃がす。
# - prefix + Space : fzf popup で選択。一覧に無い名前を打てばその場で新規作成
#                    (既定の next-layout は使わないので上書きしてよい)
# - prefix + Tab   : 直前のセッションへトグル
# - prefix + S     : 組み込み choose-tree（fzf / スクリプト無しでも動く保険）
# popup の非対話シェルは ~/.zshrc を読まず PATH に ~/dotfiles/bin が無いことが
# あるため、フルパスで起動する。
bind Space display-popup -E -w 60% -h 50% "~/dotfiles/bin/tmux-sessionizer"
bind Tab switch-client -l
bind S choose-tree -Zs

# Seamless pane/split navigation with Neovim (smart-splits.nvim)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# OSC 52 (clipboard) を外側ターミナルへ流すための tmux 設定。
# - set-clipboard external: tmux 3.x で OSC 52 を外側に emit させる
# - allow-passthrough: 未対応 OSC を DCS でラップして通す経路 (例: nvim → IME 用 OSC 1337)
# - terminal-overrides Ms=...: tmux に OSC 52 のフォーマットを教える (xterm 系の場合)
# 旧来 mosh 用に持っていたカスタム MouseDragEnd1Pane バインドは
# Eternal Terminal (et) 移行で不要になったため撤去 (2026-04-30)。
set -g set-clipboard external
set -g allow-passthrough on
set -g terminal-overrides "xterm-256color:Ms=\\E]52;c;%p2%s\\E\\\\"

set -g status on
set -g status-position bottom
set -g status-style 'bg=default,fg=colour250'
# セッションを分けると「今どのテーマにいるか」が分からなくなるので、
# マシン名の隣に現在のセッション名 (#S) を強調表示する。
set -g status-left-length 40
set -g status-left '#(if [ -f ~/.machine-name ]; then cat ~/.machine-name; else hostname -s; fi):#[fg=colour214,bold]#S#[default] :: '
set -g status-right ''

# ウィンドウ名 (#W) の既定をプロセス名から cwd のベース名へ変える。
# Claude Code を複数ウィンドウで走らせると #W が全部 'claude' になり区別が付かない。
# cwd なら grimdawn / short-stories / kanden-python のように意味のある名前になる。
# prefix + , で手動リネームすると tmux 側が automatic-rename を 0 にするため、
# 手動名はそのまま残る（同一リポジトリで 2 つ動かす時はこれで区別する）。
# 自動に戻したくなったら: tmux set -uw automatic-rename
set -g automatic-rename-format '#{b:pane_current_path}'

# ウィンドウ一覧はクライアントの幅で表示を切り替える。
# 実測値: WezTerm = 158 桁 / iPhone (Moshi) = 50 桁。閾値は 80 に置く。
#   広い端末 : 全ウィンドウの名前を出す        0:kanden-python | 1:api-test | 2:zsh
#   狭い端末 : 現在のウィンドウ以外は番号だけ  0 | 1:kanden-p… | 2
# ハマりどころ 2 点:
#   - #{<:a,b} は文字列比較で「158 < 80」が真になる。数値比較は #{e|<:} が必須。
#   - 修飾子の中では #W / #I は展開されない。window_name / window_index を書く。
set -g window-status-format         '#{?#{e|<:#{client_width},80},#{window_index},#{window_index}:#{=/12/…:window_name}}'
set -g window-status-current-format '#{window_index}:#{=/#{?#{e|<:#{client_width},80},8,12}/…:window_name}'
set -g window-status-current-style  'bg=colour239'
# separator は書式展開されない（既定の status-format[0] で format 系だけが #{T:...}
# で包まれ、separator は素の #{window-status-separator} で参照されている）ため、
# 幅による出し分けはできない。50 桁でも収まるので固定のままにする。
set -g window-status-separator ' | '

# 画面上部に「全セッションの概況」を 1 行出す（下段のステータス行は現在の
# セッションの情報のまま）。ステータス行は status-position が全行に効くので
# 上下に振り分けられない。そのためペイン境界線を最上段のヘッダとして流用する。
#
# コスト: ペイン 1 段につき 1 行消費する。左右分割は 1 行を共有するので追加
#         コスト無し、上下分割 (prefix + s) は段ごとに 1 行増える。
#
# ハマりどころ:
#   - 最上段左端の判定に pane_top / pane_left は使えない。このオプションを
#     有効にするとペインが 1 行目から始まり pane_top が 0 にならないため。
#     専用フラグの pane_at_top / pane_at_left を使う。
#   - #[fg=colour214,bold] のカンマは #{?:,} の引数区切りと衝突するので
#     #[fg=colour214#,bold] のように # でエスケープする。
#   - #{S:} ループの中でも #{client_session} は「そのクライアントが見ている
#     セッション」を指すので、現在地の強調に使える。
#   - 行頭・行末には tmux が 2 セルの罫線を必ず描く。align では消せない
#     (align=left は既定と同一。pane-border-lines を変えても文字が変わるだけ)。
#     右寄せ時に区切りの空白を名前の後ろに置いてあるのは、この末尾 2 セルとの
#     間に 1 つ空きを作って左右のインデントを揃えるため。
#
# TODO: セッション名の前に Claude Code の状態記号を出す。~/.claude/sessions/*.json
#       に status(idle/busy) と pane id があるので、そこから各セッションの
#       @cc_status を更新して拾う予定。今は枠だけで名前しか出していない。
set -g pane-border-status top
set -g pane-border-format '#{?#{&&:#{pane_at_top},#{pane_at_left}},#[align=right]#{S:#{?#{==:#{session_name},#{client_session}},#[fg=colour214#,bold]#{session_name}#[default],#[fg=colour244]#{session_name}#[default]} },}'
